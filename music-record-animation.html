<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Record animator</title>
<style>
:root{--bg:#f1ede4;--panel:#fffdf8;--ink:#1d2428;--muted:#6b7378;--line:#d9d3c5;--accent:#c4521f;--stage:#12171a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1113;--panel:#171d20;--ink:#e9e6dc;--muted:#8f979b;--line:#2b3438;--accent:#f0a04b;--stage:#0a0d0f}}
:root[data-theme="dark"]{--bg:#0d1113;--panel:#171d20;--ink:#e9e6dc;--muted:#8f979b;--line:#2b3438;--accent:#f0a04b;--stage:#0a0d0f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px}
h1{font:700 1.5rem/1.2 Georgia,"Times New Roman",serif;margin:0}
p{margin:4px 0 0;color:var(--muted)}
.stage{background:var(--stage);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,label.btn,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,label.btn:focus-within,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#status{color:var(--muted);font-size:.9rem;flex:1 1 200px}
</style>
</head>
<body>
<main>
  <div>
    <h1>Record animator</h1>
    <p>Load a song and watch the record spin to it. Save the result as a video.</p>
  </div>
  <div class="stage"><canvas id="c" width="1280" height="720" aria-label="Music animation"></canvas></div>
  <div class="bar">
    <label class="btn">Choose audio<input type="file" id="file" accept="audio/*"></label>
    <button id="play" class="primary" disabled>Play</button>
    <select id="mode" aria-label="Animation style">
      <option value="radial">Vinyl and rays</option>
      <option value="bars">Vinyl and bars</option>
      <option value="wave">Vinyl and waveform</option>
    </select>
    <select id="res" aria-label="Video quality"><option value="720">720p</option><option value="1080" selected>1080p (Full HD)</option><option value="1440">1440p (2K)</option><option value="2160">2160p (4K)</option></select>
    <button id="rec" disabled>Record video</button>
    <span id="status">No audio loaded yet.</span>
  </div>
  <audio id="audio" crossorigin="anonymous"></audio>
</main>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1280,H=720,cx=W/2,cy=H/2,S=1;
var audio=document.getElementById('audio'),fileIn=document.getElementById('file');
var playBtn=document.getElementById('play'),recBtn=document.getElementById('rec');
var resSel=document.getElementById('res');
function applyRes(){var v=parseInt(resSel.value,10);cv.width=Math.round(v*16/9);cv.height=v;S=v/720}
resSel.addEventListener('change',applyRes);applyRes();
var modeSel=document.getElementById('mode'),statusEl=document.getElementById('status');
var AC=null,analyser=null,dest=null,freq=null,wave=null,rec=null,chunks=[];
var angle=0,bass=0,hue=28,t=0;

function setup(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  var src=AC.createMediaElementSource(audio);
  analyser=AC.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.82;
  dest=AC.createMediaStreamDestination();
  src.connect(analyser);analyser.connect(AC.destination);analyser.connect(dest);
  freq=new Uint8Array(analyser.frequencyBinCount);wave=new Uint8Array(analyser.fftSize);
}
fileIn.addEventListener('change',function(){
  var f=fileIn.files[0];if(!f)return;
  audio.src=URL.createObjectURL(f);
  statusEl.textContent=f.name;
  playBtn.disabled=false;recBtn.disabled=false;playBtn.textContent='Play';
});
playBtn.addEventListener('click',function(){
  setup();AC.resume();
  if(audio.paused){audio.play();}else{audio.pause();}
});
audio.addEventListener('play',function(){playBtn.textContent='Pause'});
audio.addEventListener('pause',function(){playBtn.textContent='Play'});
audio.addEventListener('ended',function(){playBtn.textContent='Play';if(rec&&rec.state==='recording')rec.stop()});

recBtn.addEventListener('click',function(){
  if(rec&&rec.state==='recording'){rec.stop();return;}
  if(!window.MediaRecorder){statusEl.textContent='This browser cannot record video.';return;}
  setup();AC.resume();
  var stream=cv.captureStream(30);
  dest.stream.getAudioTracks().forEach(function(tr){stream.addTrack(tr)});
  var types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  var mt=types.filter(function(m){return MediaRecorder.isTypeSupported(m)})[0]||'';
  chunks=[];var bits={720:8e6,1080:16e6,1440:28e6,2160:50e6}[resSel.value]||16e6;
  var opts={videoBitsPerSecond:bits,audioBitsPerSecond:192000};if(mt)opts.mimeType=mt;
  rec=new MediaRecorder(stream,opts);
  rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
  rec.onstop=function(){
    var type=rec.mimeType||'video/webm';
    var blob=new Blob(chunks,{type:type});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='record-animation.'+(type.indexOf('mp4')>-1?'mp4':'webm');
    document.body.appendChild(a);a.click();a.remove();
    recBtn.textContent='Record video';statusEl.textContent='Video saved.';
  };
  audio.currentTime=0;audio.play();rec.start();
  recBtn.textContent='Stop and save';statusEl.textContent='Recording until the song ends...';
});

function disc(r,spin){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(spin);
  var g=ctx.createRadialGradient(0,0,r*.2,0,0,r);
  g.addColorStop(0,'#1c2226');g.addColorStop(1,'#0b0e10');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  for(var i=r*.42;i<r-4;i+=5){ctx.beginPath();ctx.arc(0,0,i,0,7);ctx.stroke();}
  // light sheen
  var sh=ctx.createConicGradient?ctx.createConicGradient(0,0,0):null;
  if(sh){sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.1,'rgba(255,255,255,.10)');
    sh.addColorStop(.25,'rgba(255,255,255,0)');sh.addColorStop(.6,'rgba(255,255,255,0)');
    sh.addColorStop(.75,'rgba(255,255,255,.10)');sh.addColorStop(.9,'rgba(255,255,255,0)');
    ctx.fillStyle=sh;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();}
  // label
  var lr=r*.3+bass*r*.03;
  ctx.fillStyle='hsl('+hue+',78%,52%)';ctx.beginPath();ctx.arc(0,0,lr,0,7);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.arc(0,0,lr*.62,0,7);ctx.fill();
  ctx.fillStyle='hsl('+hue+',78%,52%)';ctx.fillRect(-lr*.5,-2,lr,4);
  ctx.fillStyle='#0b0e10';ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
  ctx.restore();
}

function draw(){
  requestAnimationFrame(draw);
  t+=.016;ctx.setTransform(S,0,0,S,0,0);
  var playing=analyser&&!audio.paused;
  if(playing){analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(wave);}
  var n=analyser?freq.length:0,sum=0;
  if(playing){for(var i=0;i<24;i++)sum+=freq[i];bass=bass*.8+(sum/24/255)*.2*1;}else{bass*=.95;}
  var b=Math.min(1,bass*1.6);
  hue=(hue+(playing?.25+b*1.2:.05))%360;
  angle+=playing?.012+b*.03:.002;

  ctx.fillStyle='rgba(10,13,15,'+(playing?.32:1)+')';ctx.fillRect(0,0,W,H);
  var R=H*.27*(1+b*.05),mode=modeSel.value;

  if(playing){
    if(mode==='radial'){
      var rays=120;ctx.lineCap='round';ctx.lineWidth=3.2;
      for(var k=0;k<rays;k++){
        var v=freq[Math.floor(Math.pow(k/rays,1.6)*n*.55)]/255;
        var a=k/rays*Math.PI*2+angle*.3,r1=R+14,r2=r1+8+v*H*.2;
        ctx.strokeStyle='hsl('+((hue+k*1.4)%360)+',85%,'+(48+v*20)+'%)';
        ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
        ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);ctx.stroke();
      }
    }else if(mode==='bars'){
      var cnt=72,bw=W/cnt;
      for(var j=0;j<cnt;j++){
        var vv=freq[Math.floor(Math.pow(j/cnt,1.5)*n*.5)]/255,h=8+vv*H*.32;
        ctx.fillStyle='hsl('+((hue+j*3)%360)+',85%,'+(45+vv*22)+'%)';
        ctx.fillRect(j*bw+2,H-h,bw-4,h);
        ctx.fillRect(j*bw+2,0,bw-4,h*.45);
      }
    }else{
      ctx.lineWidth=3;ctx.strokeStyle='hsl('+((hue+180)%360)+',85%,60%)';ctx.beginPath();
      var steps=240;
      for(var s=0;s<=steps;s++){
        var sample=(wave[Math.floor(s/steps*(wave.length-1))]-128)/128;
        var ang=s/steps*Math.PI*2,rr=R+30+sample*H*.12;
        var px=cx+Math.cos(ang)*rr,py=cy+Math.sin(ang)*rr;
        if(s===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.stroke();
    }
  }else{
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='20px Georgia,serif';ctx.textAlign='center';
    ctx.fillText(audio.src?'Press Play':'Choose an audio file to begin',cx,H-48);
  }
  disc(R,angle);
}
draw();
})();
</script>
</body>
</html>
